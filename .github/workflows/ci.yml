name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Prepare Rust test temp directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\imm-rust-tests"

      - name: Test Rust library
        env:
          TEMP: ${{ runner.temp }}\imm-rust-tests
          TMP: ${{ runner.temp }}\imm-rust-tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
