[package]
name = "integrated-mod-manager"
version = "3.2.20"
description = "A desktop mod manager for xxmi built with Tauri"
authors = ["YourBadLuck"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wuwa_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "protocol-asset", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Optimized reqwest with minimal features for smaller binary size
reqwest = { version = "0.13.1", features = ["stream"], default-features = false }
# Keep the same ring-backed rustls provider used by tauri-plugin-updater and
# install it before any application-owned reqwest client is constructed.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Use tokio with only required features instead of "full"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "fs", "io-util", "macros", "sync"] }
zip = "7.3.0"
futures-util = "0.3.31"
md-5 = "0.10.6"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10.9"
atomic-write-file = "0.3.0"
fd-lock = "4.0.4"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
remove_dir_all = "1.0.0"
notify = "8.2.0"
# Additional async utilities
once_cell = "1.19.0"
log = "0.4.20"
urlencoding = "2.1.3"
tauri-plugin-tracing = "0.3"
tauri-plugin-deep-link = "2.4"
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }

# Windows-specific dependencies for hotreload functionality (legacy keybd_event only)
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "winuser",
    "processthreadsapi",
    "handleapi",
    "winnt",
    "psapi",
    "winbase",
    "fileapi",
    "minwinbase",
    "tlhelp32",
    "errhandlingapi",
    "winerror"
] }
windows-sys = { version = "0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO"
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# Testing dependencies
[dev-dependencies]
tempfile = "3.24.0"

# Add optimization profile for release builds
[profile.release]
# Enable link-time optimization for smaller and faster binaries
lto = true
# Use one codegen unit for better optimization
codegen-units = 1
# Let background-task panics unwind instead of terminating the entire GUI process.
panic = "unwind"
# Strip symbols for smaller binary
strip = true
# Prioritizes small binary size. Use `3` if you prefer speed.
opt-level = "s"

[profile.dev]
incremental = true # Compile your binary in smaller steps.
